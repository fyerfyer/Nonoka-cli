[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nonoka-cli"
version = "0.2.30"
description = "OpenCode backend for the Nonoka Agent framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "nonoka>=1.3.8",
  "mcp>=1.27.2,<2",
  "structlog>=24.0.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[tool.uv.sources]
nonoka = { path = "../nonoka-agent", editable = true }

[project.scripts]
nonoka-cli = "nonoka_cli.cli:main"
nonoka = "nonoka_cli.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
]
repo-map = [
  "nonoka[repo-map]>=1.3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nonoka_cli"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/nonoka_cli",
  "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short --import-mode=importlib"
markers = [
  "integration: tests that start real subprocesses or external services",
  "e2e: end-to-end workflow tests",
  "live: tests that call real LLM/API (not CI-stable)",
  "eval: deterministic agent-evaluation tests; live evals are opt-in",
]

[tool.coverage.run]
source = ["src/nonoka_cli"]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
