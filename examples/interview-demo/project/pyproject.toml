[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parcelwatch-demo"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
parcelwatch = "parcelwatch.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/parcelwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
